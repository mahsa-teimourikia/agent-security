name: Validate learning materials
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install contributor dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          python -m pip install -e '.[contributor]'
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Parse notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.ipynb'):
              data = json.loads(path.read_text())
              assert data['nbformat'] == 4, path
              assert data['cells'], path
              assert all(cell.get('id') for cell in data['cells']), f'{path}: cell id missing'
              print(f'valid notebook: {path}')
          PY
      - name: Compile Python course modules
        run: python -m compileall -q curriculum tests
      - name: Execute credential-free course notebooks
        env:
          PYTHONPATH: .
        run: python scripts/execute-notebooks.py --timeout 90
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Validate learning links
        run: npm run check:pages-links
      - name: Build and smoke-test Pages
        run: npm run test:pages
      - name: Test quiz behavior
        run: npm run test:quiz
