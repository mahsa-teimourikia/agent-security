name: Deploy Agent Security Learning Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate Python labs
        run: python -m compileall -q labs
      - name: Validate notebooks
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('labs/notebooks').glob('*.ipynb'):
              data=json.loads(path.read_text())
              assert data['nbformat'] == 4 and isinstance(data['cells'], list)
          print('notebooks valid')
        shell: bash
      - name: Assemble Pages site
        run: |
          mkdir -p site/quiz
          cp -R hub/. site/
          cp -R quiz/. site/quiz/
          cp README.md site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
