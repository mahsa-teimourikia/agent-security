<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent incident recovery: verify every transition</title>
  <desc id="desc">A candidate incident signal flows through detection admission, verified capability revocation, an exact recovery plan, a single-use approval gate, and a provider effect gate. Detection and effect decisions also feed privacy-aware audit evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52606D"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #16324F; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #16324F; }
      .group-label { font: 700 19px Inter, Arial, sans-serif; fill: #16324F; }
      .node-label { font: 700 20px Inter, Arial, sans-serif; fill: #16324F; text-anchor: middle; }
      .node-subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #52606D; text-anchor: middle; }
      .edge-label { font: 600 13px Inter, Arial, sans-serif; fill: #16324F; text-anchor: middle; }
      .legend { font: 400 14px Inter, Arial, sans-serif; fill: #16324F; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#F7F9FC"/>
  <text class="title" x="64" y="72">Agent incident recovery: verify every transition</text>
  <text class="subtitle" x="64" y="108">A signal may trigger investigation; only verified control-plane evidence may restore capability or release an effect.</text>

  <g id="groups">
    <rect x="64" y="168" width="464" height="360" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
    <text class="group-label" x="88" y="204">Evidence admission</text>
    <rect x="544" y="168" width="704" height="360" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
    <text class="group-label" x="568" y="204">Trusted recovery control plane</text>
    <rect x="1264" y="168" width="272" height="360" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
    <text class="group-label" x="1288" y="204">External effect</text>
    <rect x="64" y="568" width="1472" height="168" rx="18" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
    <text class="group-label" x="88" y="604">Operations evidence</text>
  </g>

  <g id="primary-edges" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-blue)">
    <path d="M288 348 H320"/>
    <path d="M504 348 H568"/>
    <path d="M768 348 H800"/>
    <path d="M1000 348 H1032"/>
    <path d="M1224 348 H1288"/>
  </g>
  <g id="audit-edges" fill="none" stroke="#52606D" stroke-width="2.25" stroke-dasharray="7 6" marker-end="url(#arrow-slate)">
    <path d="M412 416 V552 H620 V616"/>
    <path d="M1400 416 V552 H980 V616"/>
  </g>

  <g id="edge-labels">
    <text class="edge-label" x="304" y="258">candidate signal</text>
    <text class="edge-label" x="536" y="258">admitted evidence</text>
    <text class="edge-label" x="784" y="258">revocation receipt</text>
    <text class="edge-label" x="1016" y="258">plan digest</text>
    <text class="edge-label" x="1256" y="258">narrow capability</text>
    <text class="edge-label" x="516" y="544">decision</text>
    <text class="edge-label" x="1190" y="544">outcome</text>
  </g>

  <g id="nodes" filter="url(#shadow)">
    <rect x="88" y="280" width="200" height="136" rx="16" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2.5"/>
    <rect x="320" y="280" width="184" height="136" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5"/>
    <rect x="568" y="280" width="200" height="136" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5"/>
    <rect x="800" y="280" width="200" height="136" rx="16" fill="#F0EEFF" stroke="#7667E8" stroke-width="2.5"/>
    <rect x="1032" y="280" width="192" height="136" rx="16" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2.5"/>
    <rect x="1288" y="280" width="224" height="136" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2.5"/>
    <rect x="440" y="616" width="720" height="88" rx="16" fill="#FFFFFF" stroke="#52606D" stroke-width="2.5"/>
  </g>

  <g id="node-text">
    <text class="node-label" x="188" y="326">Candidate alert</text>
    <text class="node-subtitle" x="188" y="358">detector · scope</text>
    <text class="node-subtitle" x="188" y="381">evidence IDs</text>

    <text class="node-label" x="412" y="326">Detection gate</text>
    <text class="node-subtitle" x="412" y="358">source · tenant</text>
    <text class="node-subtitle" x="412" y="381">severity · time</text>

    <text class="node-label" x="668" y="326">Verified</text>
    <text class="node-label" x="668" y="352">containment</text>
    <text class="node-subtitle" x="668" y="382">all revocations confirmed</text>

    <text class="node-label" x="900" y="326">Exact recovery</text>
    <text class="node-label" x="900" y="352">plan</text>
    <text class="node-subtitle" x="900" y="378">checkpoint · versions</text>
    <text class="node-subtitle" x="900" y="399">narrow capability</text>

    <text class="node-label" x="1128" y="326">Approval gate</text>
    <text class="node-subtitle" x="1128" y="358">independent · bound</text>
    <text class="node-subtitle" x="1128" y="381">expiring · single use</text>

    <text class="node-label" x="1400" y="326">Effect gate</text>
    <text class="node-subtitle" x="1400" y="358">reserve · execute</text>
    <text class="node-subtitle" x="1400" y="381">reconcile uncertainty</text>

    <text class="node-label" x="800" y="651">Privacy-aware decision evidence</text>
    <text class="node-subtitle" x="800" y="680">run / operation IDs · phase · reason · policy version · hashes · terminal state</text>
  </g>

  <g id="legend">
    <rect x="64" y="772" width="12" height="12" rx="3" fill="#E5F7F6" stroke="#16A3A5"/>
    <text class="legend" x="84" y="783">Signal / evidence</text>
    <rect x="228" y="772" width="12" height="12" rx="3" fill="#EAF1FF" stroke="#2F6BFF"/>
    <text class="legend" x="248" y="783">Trusted policy</text>
    <rect x="376" y="772" width="12" height="12" rx="3" fill="#F0EEFF" stroke="#7667E8"/>
    <text class="legend" x="396" y="783">Recovery proposal</text>
    <rect x="552" y="772" width="12" height="12" rx="3" fill="#FFF1DF" stroke="#F59E42"/>
    <text class="legend" x="572" y="783">Control action</text>
    <rect x="704" y="772" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#52606D"/>
    <text class="legend" x="724" y="783">Audit evidence</text>
  </g>
</svg>
