<text x="1045.0" y="940" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">recovered or recovery-incomplete;</text>
<text x="1045.0" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">model text cannot decide</text>
<rect x="1290" y="885" width="140" height="120" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="1360.0" y="916" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Reconcile +</text>
<text x="1360.0" y="935" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">replan</text>
<text x="1360.0" y="959" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">new case</text>
<text x="1360.0" y="975" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">version and</text>
<text x="1360.0" y="991" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">approval;</text>
<text x="1360.0" y="1007" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">never blind</text>
<text x="1360.0" y="1023" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">retry</text>
