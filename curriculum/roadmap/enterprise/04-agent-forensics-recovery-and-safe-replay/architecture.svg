<text x="915.0" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">watermarks • gaps • tamper •</text>
<text x="915.0" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">digest</text>
<rect x="1140" y="205" width="270" height="120" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
