<text x="955.0" y="600" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">plan digest • case version •</text>
<text x="955.0" y="616" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">tenant • policy • subject •</text>
<text x="955.0" y="632" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">expiry • single use</text>
<rect x="1180" y="545" width="240" height="130" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1300.0" y="576" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Current authorization</text>
<text x="1300.0" y="600" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">authenticated actor •</text>
<text x="1300.0" y="616" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">current resource •</text>
<text x="1300.0" y="632" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">operation • target • policy</text>
<rect x="120" y="885" width="280" height="120" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="260.0" y="916" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Provider effect</text>
<text x="260.0" y="940" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">same logical ID • new attempt ID</text>
<text x="260.0" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">• may commit then time out</text>
<rect x="520" y="885" width="260" height="120" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
