<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Evidence Becomes Recovery Only Through Reconciliation and Current Authority</title>
<desc id="desc">Runtime events, timestamps, summaries, and checkpoints begin as untrusted evidence. Admission authenticates producer and tenant, verifies an Ed25519 signature, time, sequence, and previous digest. A chronology verifier checks required IDs, source high-watermarks, gaps, tampering, and creates a digest bound into the validated checkpoint. The provider is queried with each original logical operation ID. A classifier skips committed effects, permits authoritative absence, or retains reconcile, review, and denial states. An exact single-use approval and current authorization gate precede provider dispatch. The provider may commit then time out, so a separate postcondition query verifies identical intent and authoritative state. Recovery ends recovered or recovery-incomplete; incomplete state requires reconciliation and a new versioned plan rather than blind retry.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
