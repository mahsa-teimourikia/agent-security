<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">Architecture Review as an Evidence Loop</title>
<desc id="desc">A versioned but untrusted design packet passes strict schema validation and becomes an authority and effect graph. Human or model reviewers may propose threats, while deterministic versioned invariants consume producer-authenticated, tenant-bound, current evidence. Violations become actionable findings and a packet-bound PASS, BLOCK, or UNKNOWN review receipt. Named control and risk owners make a versioned repair, independent tests admit new evidence, and a separate authorized release gate decides whether to deploy.</desc>
