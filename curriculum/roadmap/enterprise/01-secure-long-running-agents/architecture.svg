<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Durable State Resumes Only Under Fresh, Bounded Authority</title>
<desc id="desc">An untrusted wake event points to a server-owned checkpoint. Integrity and lifecycle checks produce verified state without authority. Current identity, policy, intent, credential, budget, and approval services feed a trusted resume reauthorization gate. A compare-and-set creates one short lease with a separate heartbeat deadline; stale owners are released and must reauthorize. A bounded executor consumes the lease for one logical operation, an external provider may commit despite a lost response, and an outcome verifier queries authoritative receipts before any retry.</desc>
