<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">Governance Is an Authenticated Lifecycle Control Plane</title>
<desc id="desc">An inventory payload begins as hostile JSON. Pydantic validates strict shape but does not grant trust. Evidence admission authenticates producer, key, tenant, evidence kind, agent revision, proof, time, and conflicting delivery. The exact evidence set binds policy and control versions, counts, freshness, and severe outcomes. A governance evaluator applies risk tier, transition policy, evidence requirements, and hard blockers. Exceptions are exact, owned, independently approved, expiring, and cannot cross the hard floor. A separate current single-use approval binds the decision digest and target before optimistic-concurrency mutation changes lifecycle state; retirement is terminal.</desc>
