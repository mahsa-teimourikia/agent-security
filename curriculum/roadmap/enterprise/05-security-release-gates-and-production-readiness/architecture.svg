<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Production Authority Requires Exact Evidence and Verified Outcomes</title>
<desc id="desc">Release artifacts begin as hostile inputs. Pydantic validates shape but does not grant trust. Evidence admission authenticates producer, key, tenant, evidence kind, proof, counts, owner, and time. The exact dossier binds release digest, environment, policy, sources, freshness, and coverage. The release gate distinguishes ready, blocked, and incomplete states and keeps severe failures outside averages. Exceptions are exact, owned, expiring, and cannot cross the non-waivable floor. A plan and separate single-use approval bind the evidence digest, stable target, thresholds, and record version before current authorization permits a canary. Provider state and canary metrics are independently verified. Passing thresholds lead to a verified promotion; failure leads to a verified stable rollback, while uncertain outcomes remain explicit and require reconciliation and a new plan rather than blind retry.</desc>
