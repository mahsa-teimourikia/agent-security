<text x="205.0" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Agent / telemetry</text>
<text x="205.0" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">span attributes and model</text>
<text x="205.0" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">summary are observations,</text>
<text x="205.0" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">not authority</text>
<rect x="420" y="205" width="270" height="120" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
