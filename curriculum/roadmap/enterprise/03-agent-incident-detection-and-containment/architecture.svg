<text x="915.0" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">evidence IDs • stable</text>
<text x="915.0" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">fingerprint</text>
<rect x="1140" y="205" width="270" height="120" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="1275.0" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Deduplicated incident</text>
