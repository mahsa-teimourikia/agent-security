<text x="260.0" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">incomplete; never fabricated</text>
<text x="260.0" y="972" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">success</text>
