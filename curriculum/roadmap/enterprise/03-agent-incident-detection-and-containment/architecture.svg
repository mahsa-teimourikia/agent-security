<text x="955.0" y="616" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">destination • queue; may fail or</text>
<text x="955.0" y="632" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">time out</text>
