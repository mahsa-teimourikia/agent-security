<text x="555.0" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">producer • tenant • signature</text>
<text x="555.0" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">• freshness • schema • dedup</text>
<rect x="780" y="205" width="270" height="120" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
