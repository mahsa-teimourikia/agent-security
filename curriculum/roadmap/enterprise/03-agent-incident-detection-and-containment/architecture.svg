<text x="590.0" y="616" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">• policy • approver • expiry</text>
<rect x="810" y="545" width="290" height="130" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
