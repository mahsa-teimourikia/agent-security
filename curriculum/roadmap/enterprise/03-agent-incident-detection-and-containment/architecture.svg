<text x="1045.0" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">remediation • regression •</text>
<text x="1045.0" y="972" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">current policy</text>
<rect x="1290" y="885" width="140" height="120" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1360.0" y="916" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Recovery-ready</text>
<text x="1360.0" y="940" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">not resumed;</text>
<text x="1360.0" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">not replayed;</text>
<text x="1360.0" y="972" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">not resolved</text>
