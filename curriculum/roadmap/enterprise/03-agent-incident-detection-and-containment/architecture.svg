<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Observable Evidence Becomes Containment Only Through Trusted Gates</title>
<desc id="desc">Agent telemetry and model summaries enter as untrusted observations. An evidence admission gate authenticates the producer and tenant, verifies integrity and freshness, and deduplicates signals. A versioned detector binds exact evidence to a stable alert, and a trusted application opens one versioned incident. An asset gate computes tenant-bounded run, agent, credential, queue, and destination scope. A signed single-use plan authorizes five exact containment connectors. Their responses remain untrusted until independent postconditions produce a contained or containment-incomplete state. A digest-linked vault preserves evidence. A separate recovery role requires root cause, remediation, regression, and current policy to issue a recovery-ready handoff that does not itself resume, replay, or resolve the incident.</desc>
