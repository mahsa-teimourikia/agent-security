<text x="920.0" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">workload identity • isolation</text>
<text x="920.0" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">• attenuated tools</text>
