<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">Mediate Every Authority-Changing Path</title>
<desc id="desc">An authenticated edge request reaches a bounded orchestrator and tenant-isolated runtime. The model and context can propose but remain untrusted. Every data, effect, and protocol path terminates at a dedicated gateway that enforces workload identity, tenant binding, current policy, evidence, and boundary-specific data or egress controls. A separate highly available identity, policy, and revocation plane produces versioned decisions. Minimized admitted evidence feeds independently operated containment and recovery controls.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Mediate Every Authority-Changing Path</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">Authenticate identity, bind tenant and capability, enforce current policy, constrain egress, and retain evidence at the owning boundary</text>
