<text x="560.0" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Orchestrator</text>
<text x="560.0" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">bounded plan • capability</text>
<text x="560.0" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">selection • durable state</text>
<rect x="790" y="215" width="260" height="110" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
