<text x="1280.0" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">proposes; retrieved/tool/peer</text>
<text x="1280.0" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">content stays untrusted</text>
<rect x="160" y="555" width="280" height="110" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
