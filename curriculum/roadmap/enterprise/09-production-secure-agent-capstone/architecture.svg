<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1260" viewBox="0 0 1560 1260" role="img" aria-labelledby="title desc">
<title id="title">Production Secure-Agent Authority and Evidence Flow</title>
<desc id="desc">An authenticated user and workload provide trusted tenant, case, and policy scope to authorization-before-ranking retrieval. Admitted documents, memory, and tool output remain untrusted data. An attenuated grant bounds triage and specialist agents, which produce a strict action proposal and exact separate approval. An application-owned effect gateway rechecks identity, grant, MCP registration, approval, policy, and control epoch before an idempotent provider effect. Durable state reconciles unknown outcomes, while independently authorized kill and recovery advance a monotonic epoch. Minimized decision evidence and drills form an exact-candidate dossier for an independent READY, BLOCKED, or INCOMPLETE technical-readiness gate that is not deployment approval.</desc>
