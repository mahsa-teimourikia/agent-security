<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Containment Is an Independent, Versioned Authority Change</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">Authenticate commands, propagate a monotonic epoch, enforce twice, reconcile effects, and recover under separate approval</text>
