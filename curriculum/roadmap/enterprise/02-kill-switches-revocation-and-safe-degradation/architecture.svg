<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Containment Is an Independent, Versioned Authority Change</title>
<desc id="desc">An independent incident operator sends an authenticated containment command. A trusted gate validates tenant, incident, signature, and exact next epoch, producing an immutable snapshot. Authenticated distribution feeds both a scheduling gate and an effect gateway with freshness and propagation SLO checks. Queue and agent proposals remain untrusted. Safe degradation denies consequential actions while preserving governed diagnostics. External provider effects are classified by an outcome reconciler as canceled, committed, or unknown. Recovery requires a different approver, an expiring single-use plan, and a new epoch, with receipts preserving evidence.</desc>
