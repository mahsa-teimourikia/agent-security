<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Telemetry Becomes Assurance Only After Trusted Admission and Monitoring</title>
<desc id="desc">An enterprise agent, tools, trusted application, policy enforcer, effect observer, and telemetry ingress produce observations. Admission minimizes data and verifies tenant and version bindings before trace assembly checks sequence, required events, gaps, and replay. Deterministic monitors evaluate tenant isolation, decision-to-effect order, approvals, budgets, and versions. The state machine returns healthy, degraded, violated, or unknown; missing proof becomes unknown. A bounded, idempotent response and protected evidence archive remain under application and operations authority.</desc>
