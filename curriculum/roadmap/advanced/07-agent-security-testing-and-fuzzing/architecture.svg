<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
<title id="title">Generate Broadly; Judge with Application-Owned Invariants</title>
<desc id="desc">Explicit application-owned invariants and a labelled seed corpus feed untrusted Hypothesis generators and mutators. Generated values and command sequences exercise a typed action gateway and durable workflow. An observable trace records pre-state, post-state, decisions, and effects. An independent security oracle compares those outcomes with invariants and groups verified failures. A shrinker removes noise only while preserving the same failure, producing a minimal versioned reproducer that enters the regression corpus and informs a release decision. Continuous isolated fuzzing reports coverage, corpus health, flakiness, and triage evidence back to operations.</desc>
