<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Generate Broadly; Judge with Application-Owned Invariants</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">Keep generators untrusted, observe real state and effects, shrink without changing semantics, and retain every verified finding</text>
