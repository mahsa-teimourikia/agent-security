<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">Authenticated Peer Messages Remain Untrusted Data</title>
<desc id="desc">A researcher agent produces a peer message whose prose remains untrusted. A trusted gateway authenticates the workload edge and checks tenant, type, source registry, replay, and lifetime before issuing an integrity-bound envelope containing source references, taint labels, and allowed uses. A writer receives minimized admitted context, while a transformation gate requires unchanged security metadata on the derived artifact. A separate authorizer validates the current actor, target, policy, artifact, and taint before one narrow idempotent effect. Every stage emits a redacted receipt without raw content or credentials.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
