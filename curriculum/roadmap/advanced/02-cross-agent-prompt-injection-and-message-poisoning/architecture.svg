<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Authenticated Peer Messages Remain Untrusted Data</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">Identity attributes a message; provenance, taint, allowed use, and current authorization constrain what downstream agents may do</text>
