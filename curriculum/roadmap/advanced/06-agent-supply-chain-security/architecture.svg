<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1380" viewBox="0 0 1500 1380" role="img" aria-labelledby="title desc">
<title id="title">Verify Before Activation; Recover by Immutable Digest</title>
<desc id="desc">Pinned source and workflow inputs enter an isolated builder, which produces a digest-addressed agent component, signed in-toto and SLSA provenance, and digest-bound inventory and scan evidence. The bundled release candidate remains untrusted until an independent verification gate checks signature, signer, issuer, builder, source, digest, dependencies, capability manifest, lifecycle, risk, and replay state against trusted policy. A verified receipt permits only a canary deployment. A promotion gate binds healthy runtime observations to the exact deployment before production activation. A health incident can issue a short-lived one-use rollback guard binding the failed digest to a last-known-good immutable digest, and successful restoration consumes the guard.</desc>
