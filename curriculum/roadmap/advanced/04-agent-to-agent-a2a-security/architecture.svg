<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">A2A Discovery Describes; the Application Authorizes</title>
<desc id="desc">An enterprise agent and external Agent Card remain in the untrusted proposal plane. A trusted card-admission gate verifies signature, lifecycle, pinned peer registry data, and protocol version, then intersects advertised skills with local policy. A task resource monitor authorizes each SendMessage, Get, Cancel, message, artifact, and effect operation using authenticated identity, audience, tenant, owner, scope, replay, and task state. The external A2A specialist returns typed task updates and tainted artifacts. A separate callback egress gate requires HTTPS, an allowed hostname, public DNS answers, a pinned address, and no redirects before reaching the client webhook. A final idempotent effect gate and content-free receipts remain independent of peer prose.</desc>
