<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1380" viewBox="0 0 1500 1380" role="img" aria-labelledby="title desc">
<title id="title">Protocols Carry Messages; Composition Must Preserve Invariants</title>
<desc id="desc">A user request enters an authenticated web boundary. Three trusted adapters translate web authority to an A2A 1.0 task, then to an MCP 2026-07-28 tool call, then to a records HTTP API request. Every adapter authenticates its translator and calls a policy and token-exchange control that preserves the semantic case.read authority while issuing a shorter-lived, single-audience protocol scope. A content-free hop ledger links the root request, parent receipt, subject, actor, tenant, resource, audience, policy, and trace without using trace context as authority. The records API returns untrusted JSON with provenance to an evidence-admission gate. A release gate requires complete correlated lineage and releases only a verified summary with evidence ID, source version, and trace ID.</desc>
