<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Threat Hunting Produces Evidence-Linked Hypotheses, Not Response Authority</title>
<desc id="desc">Agent and model claims first pass through the prior course&#x27;s authenticated evidence admission and a protected evidence store. Evidence health checks route incomplete data to UNKNOWN. Complete evidence is partitioned by tenant, subject, case, and a 15-minute event-time window. Deterministic features feed versioned rule, Sigma, statistical, graph, or model detectors that produce evidence-linked hypotheses, not verdicts. An authorized analyst dispositions a hypothesis, after which a separate policy authorizes one bounded response. An executor performs it and an independent verifier records the effect.</desc>
