<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">One Shared Cascade Budget Bounds the Entire Agent Graph</title>
<desc id="desc">A root request reaches an untrusted supervisor that may only propose a dispatch. A trusted control plane validates the workload edge and reserves from one shared depth, fan-out, dispatch, and affected-component budget. One retry owner admits only transient retries and combines per-component circuits with queue bulkheads. Research, billing, and ticket or messaging workers are isolated fault domains with no worker-to-worker edges. A poison signal activates a containment switch that clears queues and blocks effects. Only a successful bound attempt can reach the atomic idempotent effect gate, and all decisions emit content-free receipts.</desc>
