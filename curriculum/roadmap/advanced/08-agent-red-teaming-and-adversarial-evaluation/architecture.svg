<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Red-Team Broadly; Release Only from Independently Verified Evidence</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">Bind every fixture and target version, observe effects outside the agent, preserve utility, and retain findings as regressions</text>
