<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
<title id="title">Red-Team Broadly; Release Only from Independently Verified Evidence</title>
<desc id="desc">A versioned red-team suite with valid, attack, boundary, and failure fixtures drives a bounded orchestrator against an isolated enterprise support agent. A host-side observer records actual policy decisions, state changes, and effects. An independent oracle compares those observations with application-owned invariants. Only evidence bound to the exact campaign, target, policy, tool catalog, environment, and time enters disjoint security, utility, failure-containment, and coverage metrics. Verified findings receive severity, ownership, remediation, and an exact regression fixture before the release gate returns ready, blocked, or incomplete and archives the decision evidence.</desc>
