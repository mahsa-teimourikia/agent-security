<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Context Compiler: Exact Evidence to Verified Release</title>
<desc id="desc">An authenticated request, candidate references, and current evidence registry enter a trusted context compiler. Admission precedes authority and conflict resolution, deterministic budgeting, and an exact evidence manifest. The manifest supplies data to an untrusted model. A trusted verifier compares drafted claims and citations with that manifest before producing answered, abstained, blocked, or error states. Bounded admission and release receipts flow to a minimized trace.</desc>
