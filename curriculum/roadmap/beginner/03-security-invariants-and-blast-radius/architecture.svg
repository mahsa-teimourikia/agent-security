<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Security invariants: proposal to bounded effect</title>
<desc id="desc">Security objectives define invariants and a multidimensional blast-radius ceiling. An untrusted model proposal enters a trusted application gate alongside authenticated identity, a bounded capability, current policy, budgets, and a kill switch. Only a valid transition reaches the effect ledger; decisions and effects feed evidence and safety-plus-utility evaluation.</desc>
