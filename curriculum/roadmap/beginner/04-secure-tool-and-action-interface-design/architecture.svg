<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure tool interfaces: proposal to admitted result</title>
<desc id="desc">An untrusted model proposal and tool metadata enter a trusted contract gateway. The gateway combines an exact active contract with authenticated context, business state, and an execution grant. An allowlisted adapter reaches a provider. Results are validated before model exposure, while unknown outcomes go through reconciliation and bounded traces support evaluation.</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52606D"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7667E8"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#16324F">Secure tool interfaces: proposal to admitted result</text>
<text x="60" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">Schemas constrain shape. Trusted context, current policy, business state, and recovery govern effects.</text>
<rect x="60" y="150" width="300" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="82" y="186" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">1. Propose, never authorize</text>
<rect x="410" y="150" width="760" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="432" y="186" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">2. Resolve, validate, authorize, dispatch</text>
<rect x="1220" y="150" width="320" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1242" y="186" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">3. Admit results and evidence</text>
<polyline points="320,295 390,295 390,380 670,380 670,448 700,448" fill="none" stroke="#7667E8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-purple)" stroke-dasharray="7 5"/>
<text x="520" y="370" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#7667E8">untrusted request</text>
<polyline points="650,295 680,295 680,432 700,432" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="720" y="370" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2F6BFF">exact contract</text>
<polyline points="320,575 390,575 390,690 675,690 675,512 700,512" fill="none" stroke="#7667E8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-purple)" stroke-dasharray="7 5"/>
<text x="520" y="710" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#7667E8">hints only</text>
<polyline points="650,595 685,595 685,528 700,528" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-slate)"/>
<text x="760" y="625" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#52606D">authority and state</text>
