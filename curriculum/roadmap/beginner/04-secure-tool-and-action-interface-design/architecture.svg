<text x="550.0" y="661" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#52606D">grant · policy</text>
<rect x="700" y="400" width="250" height="160" rx="16" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
