<text x="550.0" y="596" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#16324F">state</text>
<text x="550.0" y="625" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#52606D">actor · tenant</text>
