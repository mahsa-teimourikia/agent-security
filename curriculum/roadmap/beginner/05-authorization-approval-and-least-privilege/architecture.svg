<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Authorize now, approve exactly, enforce atomically</title>
<desc id="desc">An agent proposal and trusted identity and resource state feed a policy information point and policy decision point. A high-risk decision pauses for an independent approver and a server-owned receipt store. The policy enforcement point reauthorizes current state, validates and atomically consumes the receipt, creates one narrow effect, and records bounded evidence.</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52606D"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7667E8"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F59E42"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#16324F">Authorize now, approve exactly, enforce atomically</text>
<text x="60" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">The model proposes. Trusted identity, current state, policy, and an independent approver govern one bounded effect.</text>
<rect x="60" y="150" width="300" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="80" y="186" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324F">1. Propose and resolve</text>
<rect x="410" y="150" width="420" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="186" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324F">2. Decide under current policy</text>
<rect x="880" y="150" width="300" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="900" y="186" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324F">3. Review exact high-risk action</text>
<rect x="1230" y="150" width="310" height="620" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="1250" y="186" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324F">4. Reauthorize and commit once</text>
