<text x="432" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">2. What can go wrong?</text>
<rect x="880" y="160" width="660" height="500" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="902" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">3. What will we do about it?</text>
<rect x="410" y="710" width="1130" height="130" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="432" y="746" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">4. Did we do a good enough job?</text>
<polyline points="320,300 450,300" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="385" y="280" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2F6BFF">scoped DFD</text>
<polyline points="610,300 850,300 850,299 930,299" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="750" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#2F6BFF">candidate threats</text>
<polyline points="790,455 850,455 850,331.5 930,331.5" fill="none" stroke="#7667E8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-purple)" stroke-dasharray="7 5"/>
<text x="852" y="445" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#7667E8">suggest only</text>
