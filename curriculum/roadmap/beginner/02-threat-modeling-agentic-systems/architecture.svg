<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Agentic threat modeling: architecture to assurance</title>
<desc id="desc">A left-to-right threat-modeling workflow. A versioned system model enters STRIDE and abuse analysis. Attack trees and untrusted model suggestions feed an authenticated review gate. Reviewed threats are bound to controls, tests, telemetry, owners, and residual risk, producing an engineering backlog. Architecture changes and assurance metrics trigger refresh, and model suggestions never bypass review.</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2F6BFF"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52606D"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7667E8"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#16324F">Agentic threat modeling: architecture to assurance</text>
<text x="60" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">Suggestions help discovery. Authenticated review and deterministic evidence decide what enters the model.</text>
<rect x="60" y="160" width="300" height="500" rx="20" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
<text x="82" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#16324F">1. What are we working on?</text>
