<text x="970" y="775" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#52606D">gaps or stale scope</text>
<polyline points="600,804 75,804 75,336 100,336" fill="none" stroke="#52606D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-slate)" stroke-dasharray="6 5"/>
<text x="260" y="830" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#52606D">continuous refinement</text>
