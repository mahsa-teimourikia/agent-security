<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Keep untrusted content in the data plane</title>
<desc id="desc">Untrusted user, document, web, tool-result, and memory content enters source admission and optional detection. A bounded extractor feeds a model proposal into a typed policy gateway. Trusted identity, resource state, and policy authorize the proposal. The egress gateway resolves fixed destinations and allowed fields before a bounded effect and trace.</desc>
