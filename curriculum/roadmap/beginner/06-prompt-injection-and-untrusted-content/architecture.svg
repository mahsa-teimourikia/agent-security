<text x="50" y="66" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#16324F">Keep untrusted content in the data plane</text>
<text x="50" y="105" font-family="Inter,Arial,sans-serif" font-size="17" fill="#52606D">Detection adds a signal; trusted boundaries govern sources, control flow, authority, destinations, and egress.</text>
