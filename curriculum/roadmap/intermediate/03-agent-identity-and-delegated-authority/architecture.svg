<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Agent Identity and Delegated Authority Plane</title>
<desc id="desc">A human session, an attested agent workload, and a managed sponsor-backed agent identity enter a delegation authority that resolves current entitlements and issues a sender- and audience-bound root grant. The case service verifies the root, authenticates as a new workload, and exchanges it for a narrower child grant for the attachment store. Each resource-server call requires a fresh one-use request proof. The attachment store applies current resource policy before returning bounded data. Current registries, grant lineage and replay state, bounded audit receipts, and explicit outcomes support every decision.</desc>
