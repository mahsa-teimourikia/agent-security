<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure Durable Pause and Resume</title>
<desc id="desc">An authenticated resume request supplies only an opaque checkpoint identifier. Trusted application code loads a server-owned checkpoint, verifies its complete signature and parent chain, rechecks current identity, policy, tool, and exact approval, applies a deterministic migration, and atomically acquires one lease. The effect boundary dispatches one stable operation to the provider. Known receipts or explicitly unknown outcomes produce a signed child checkpoint; unknown outcomes loop through reconciliation without blind redispatch. Current registries, a transactional store, bounded audit evidence, and explicit terminal outcomes support the flow.</desc>
