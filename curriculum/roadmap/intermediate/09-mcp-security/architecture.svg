<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Modern MCP Host Security Boundary</title>
<desc id="desc">A modern MCP host receives untrusted discovery metadata and a model call proposal. Trusted inventory reconciles authenticated connection identity with an exact catalog contract, then application policy validates identity, token audience, scope, tenant, confirmation, and current state before issuing a one-use execution grant. The official MCP client invokes a server with a narrow downstream capability. Server-produced results pass through a schema, tenant, resource, error, and size gate before entering model context with an untrusted-content label. Privacy-minimized receipts record every decision phase.</desc>
