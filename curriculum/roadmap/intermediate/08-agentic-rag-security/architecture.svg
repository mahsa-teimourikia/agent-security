<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Authorization-Aware Agentic RAG Boundary</title>
<desc id="desc">An authenticated run and an untrusted agent query proposal enter a one-use retrieval broker. The trusted control plane derives scope, filters tenant, ACL, lifecycle, review, and purpose before scoring, ranks only authorized candidates under a budget, and creates provenance-bearing evidence snapshots. The agent proposes atomic claims and exact citations, while a claim release gate rechecks current evidence, source authority, support, and conflicts before rendering a cited answer. Current registries, budgets, and redacted receipts support every boundary.</desc>
