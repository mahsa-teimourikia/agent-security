<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Evidence Admission and Output Release Boundary</title>
<desc id="desc">An authenticated support workload issues a one-use request to a CRM connector. The connector returns a signed envelope containing structured facts and potentially hostile prose. Admission verifies connector identity, signature, request binding, tenant, case, schema, freshness, size, and version, then creates an evidence capsule whose prose stays external-untrusted. A context compiler quotes that prose. The agent may propose an action or fact references, but a current-state authorizer independently grants effects and an output gate reconstructs a bounded answer only from releasable cited facts. Redacted receipts record every stage without raw content.</desc>
