<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Durable Human Decision Control Plane</title>
<desc id="desc">An untrusted action proposal and serialized agent state enter a trusted review control plane. Proposal admission creates a sanitized, versioned server-owned review packet that is visible only through a tenant-scoped queue. Authenticated reviewers submit decisions to an atomic transition enforcing eligibility, separation of duties, quorum, and optimistic concurrency. Approval creates an exact one-use execution grant. Resume reauthorizes current identity, policy, resource, and logical operation before an idempotent effect. Ambiguous outcomes enter reconciliation instead of retry. Current authority feeds every enforcement point, and privacy-minimized receipts preserve decision and outcome evidence.</desc>
