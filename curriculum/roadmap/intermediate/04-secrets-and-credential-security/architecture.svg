<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secrets and Credential Execution Boundary</title>
<desc id="desc">A model proposes only a policy resource identifier. Trusted runtime identity and an application tool contract enter current resource policy. A credential broker consults vault metadata but never secret bytes, then issues an opaque one-use lease. The credential executor reauthorizes, atomically claims the lease, materializes the exact secret version into an ephemeral handle, and calls one external provider. Only a bounded result or generic error returns. Secret lifecycle, lease state, redacted receipts, and explicit outcomes support every decision.</desc>
