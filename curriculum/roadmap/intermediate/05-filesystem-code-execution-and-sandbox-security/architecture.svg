<text x="1190.0" y="491" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">memory • PIDs • disk •</text>
<text x="1190.0" y="507" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">output</text>
<rect x="1320" y="420" width="205" height="105" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
