<text x="600.0" y="460" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">current policy • image</text>
<text x="600.0" y="476" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">digest • one-use grant</text>
<rect x="875" y="205" width="190" height="105" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="970.0" y="236" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#16324F">Ephemeral workspace</text>
<text x="970.0" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">read-only input •</text>
<text x="970.0" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">one writable output</text>
<text x="970.0" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">• no secrets</text>
