<text x="970.0" y="491" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">exact roots • deny</text>
<text x="970.0" y="507" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">links and host paths</text>
