<text x="600.0" y="745" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">digests • versions • counters •</text>
<text x="600.0" y="761" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">reason • cleanup; no paths, code,</text>
<text x="600.0" y="777" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">content, or secrets</text>
