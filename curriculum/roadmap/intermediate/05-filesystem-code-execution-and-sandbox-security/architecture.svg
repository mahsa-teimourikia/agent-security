<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Filesystem and Code Execution Boundary</title>
<desc id="desc">An agent proposes only archive and program identifiers while authenticated application context supplies identity and tenant. Archive admission canonicalizes paths and rejects links, special files, collisions, and oversized content. A broker binds current policy, image, input, and program digests into a one-use grant. A disposable runtime enforces exact filesystem roots, resource budgets, default-deny network and syscall policy, validates bounded output, emits redacted receipts, and destroys the workspace on every terminal path.</desc>
