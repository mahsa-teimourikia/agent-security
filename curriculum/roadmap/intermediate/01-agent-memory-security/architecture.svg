<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure Long-Term Memory Lifecycle</title>
<desc id="desc">An authenticated actor and untrusted typed memory candidate enter a trusted write boundary. Exact source, consent, type, classification, retention, replay, and version checks precede a versioned scoped memory store. An authorized read is checked before lookup against lifecycle, deletion epoch, expiry, and consent. The output is a bounded untrusted memory view that never grants tool authority. Deletion, registries, minimized receipts, and explicit terminal outcomes complete the lifecycle.</desc>
