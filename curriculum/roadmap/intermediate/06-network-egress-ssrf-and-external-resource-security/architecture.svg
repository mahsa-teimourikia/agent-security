<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Brokered External Fetch Boundary</title>
<desc id="desc">An agent proposes only an untrusted HTTPS URL while authenticated application context supplies workload and tenant identity. A canonical parser, tenant policy, trusted resolver, and one-use broker validate the URL and every A and AAAA answer. The executor connects only to the approved IP while preserving the original Host and TLS SNI, verifies the peer, revalidates every redirect hop, and streams responses through deadline, size, expansion, and media-type limits. Only bounded content labeled external-untrusted and redacted decision receipts leave the boundary.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<text x="45" y="55" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">Brokered External Fetch Boundary</text>
<text x="45" y="91" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52606D">A URL proposal never becomes network authority; every destination, connection, redirect, and response is independently constrained</text>
