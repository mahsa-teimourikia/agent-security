<text x="695.0" y="295" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">paths • byte/time</text>
<text x="695.0" y="311" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">budgets</text>
<rect x="410" y="425" width="180" height="110" rx="14" fill="#E5F7F6" stroke="#0B7A75" stroke-width="2"/>
