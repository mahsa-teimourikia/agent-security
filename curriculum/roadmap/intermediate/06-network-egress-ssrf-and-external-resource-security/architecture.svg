<text x="500.0" y="496" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">AAAA; deny special-</text>
<text x="500.0" y="512" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52606D">use ranges</text>
