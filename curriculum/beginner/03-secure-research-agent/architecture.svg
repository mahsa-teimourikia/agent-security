<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" style="background-color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="#64748b"/>
        </marker>
        <style>
            .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 8; }
            .box-secure { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 8; }
            .box-untrusted { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 8; stroke-dasharray: 5,5; }
            .text-main { fill: #1e293b; font-size: 14px; font-weight: 600; text-anchor: middle; }
            .text-sub { fill: #64748b; font-size: 12px; text-anchor: middle; }
            .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
            .line-dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrow); }
        </style>
    </defs>

    <!-- 1. Query & Context -->
    <rect x="50" y="30" width="160" height="60" class="box" />
    <text x="130" y="55" class="text-main">User Query</text>
    <text x="130" y="75" class="text-sub">"What is the policy?"</text>

    <rect x="250" y="30" width="160" height="60" class="box-secure" />
    <text x="330" y="55" class="text-main">Actor Context</text>
    <text x="330" y="75" class="text-sub">Sensitivities Allowed</text>

    <!-- 2. Retrieval Boundary -->
    <rect x="50" y="140" width="360" height="80" class="box" />
    <text x="230" y="165" class="text-main">Candidate Retrieval</text>
    <text x="230" y="185" class="text-sub">Token/Semantic Search</text>
    <text x="230" y="205" class="text-sub">(Returns relevant but potentially unauthorized docs)</text>

    <path d="M 130 90 L 130 140" class="line" />

    <!-- 3. Access/Sensitivity Filter -->
    <rect x="50" y="270" width="360" height="60" class="box-secure" />
    <text x="230" y="295" class="text-main">Access / Sensitivity Filter</text>
    <text x="230" y="315" class="text-sub">Matches Candidate vs Context</text>

    <path d="M 230 220 L 230 270" class="line" />
    <path d="M 330 90 L 330 270" class="line-dashed" />

    <!-- 4. Authorized Evidence -->
    <rect x="50" y="380" width="360" height="60" class="box-secure" />
    <text x="230" y="405" class="text-main">Authorized Evidence</text>
    <text x="230" y="425" class="text-sub">Safe for model context</text>

    <path d="M 230 330 L 230 380" class="line" />

    <!-- 5. Simulated Model -->
    <rect x="50" y="490" width="360" height="120" class="box-untrusted" />
    <text x="230" y="525" class="text-main">Model Output (Untrusted)</text>
    <text x="230" y="545" class="text-sub">• Generated Answer</text>
    <text x="230" y="565" class="text-sub">• Claimed Citations</text>
    <text x="230" y="585" class="text-sub">• Action Proposals</text>

    <path d="M 230 440 L 230 490" class="line" />

    <!-- 6. Deterministic Controls -->
    <rect x="480" y="140" width="280" height="300" class="box-secure" />
    <text x="620" y="180" class="text-main">Deterministic Validators</text>
    
    <rect x="510" y="210" width="220" height="40" class="box" />
    <text x="620" y="235" class="text-main">Capability Contract</text>

    <rect x="510" y="270" width="220" height="40" class="box" />
    <text x="620" y="295" class="text-main">Citation Verification</text>

    <rect x="510" y="330" width="220" height="40" class="box" />
    <text x="620" y="355" class="text-main">Grounding Verification</text>

    <text x="620" y="415" class="text-sub">Outputs Audit Event</text>

    <path d="M 410 550 C 460 550 480 440 480 440" class="line" />

    <!-- 7. Safe Response -->
    <rect x="480" y="490" width="280" height="120" class="box-secure" />
    <text x="620" y="530" class="text-main">Safe Response</text>
    <text x="620" y="555" class="text-sub">ANSWERED</text>
    <text x="620" y="575" class="text-sub">INSUFFICIENT_EVIDENCE</text>
    <text x="620" y="595" class="text-sub">BLOCKED</text>

    <path d="M 620 440 L 620 490" class="line" />

</svg>
