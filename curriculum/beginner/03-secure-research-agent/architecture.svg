<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Secure research agent with authorization before ranking</title>
  <desc id="diagram-desc">A verified request enters a trusted policy resolver. Tenant, sensitivity, lifecycle, and freshness rules trim a protected corpus before eligible records are ranked. Versioned evidence snapshots go to an untrusted model. Deterministic capability, citation, and support checks produce a safe answer, abstention, or block, while a minimized audit receipt records policy and evidence references.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F6BFF"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52606D"/>
    </marker>
    <style>
      .canvas { fill: #F7F9FC; }
      .title { fill: #16324F; font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #52606D; font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .group { fill: #FFFFFF; stroke: #D7DEE8; stroke-width: 1.5; }
      .group-label { fill: #52606D; font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }
      .node { fill: #FFFFFF; stroke-width: 2; filter: url(#shadow); }
      .node-title { fill: #16324F; font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      .node-copy { fill: #52606D; font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #2F6BFF; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .edge-secondary { fill: none; stroke: #52606D; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-slate); }
      .edge-label-bg { fill: #F7F9FC; rx: 5; }
      .edge-label { fill: #52606D; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="60" y="58">Secure Research Agent</text>
  <text class="subtitle" x="60" y="84">Authorization constrains the searchable corpus before relevance ranking</text>

  <rect class="group" x="50" y="110" width="1210" height="270" rx="18"/>
  <text class="group-label" x="75" y="144">TRUSTED SEARCH CONTROL PLANE</text>
  <rect class="group" x="1310" y="110" width="240" height="270" rx="18" stroke="#7667E8" stroke-dasharray="7 6"/>
  <text class="group-label" x="1335" y="144" fill="#7667E8">UNTRUSTED GENERATION</text>
  <rect class="group" x="930" y="440" width="620" height="210" rx="18"/>
  <text class="group-label" x="955" y="474">DETERMINISTIC RELEASE CONTROL</text>
  <rect class="group" x="570" y="710" width="660" height="130" rx="18"/>
  <text class="group-label" x="595" y="740">DEFENDER-ONLY OPERATIONS</text>

  <path class="edge" d="M260 240 H320"/>
  <path class="edge" d="M520 240 H580"/>
  <path class="edge" d="M770 240 H830"/>
  <path class="edge" d="M1020 240 H1080"/>
  <path class="edge" d="M1230 240 H1340"/>
  <path class="edge" d="M1430 300 V410 H1050 V510"/>
  <path class="edge-secondary" d="M1155 300 V460 H1150 V510"/>
  <path class="edge" d="M1240 560 H1300"/>
  <path class="edge-secondary" d="M1100 610 V680 H1000 V750"/>
  <path class="edge-secondary" d="M420 300 V680 H800 V750"/>

  <g>
    <rect class="edge-label-bg" x="266" y="212" width="48" height="20"/>
    <text class="edge-label" x="290" y="226">session</text>
    <rect class="edge-label-bg" x="526" y="212" width="48" height="20"/>
    <text class="edge-label" x="550" y="226">trim</text>
    <rect class="edge-label-bg" x="776" y="212" width="48" height="20"/>
    <text class="edge-label" x="800" y="226">eligible</text>
    <rect class="edge-label-bg" x="1029" y="212" width="42" height="20"/>
    <text class="edge-label" x="1050" y="226">top-k</text>
    <rect class="edge-label-bg" x="1241" y="212" width="88" height="20"/>
    <text class="edge-label" x="1285" y="226">evidence only</text>
    <rect class="edge-label-bg" x="1228" y="382" width="104" height="20"/>
    <text class="edge-label" x="1280" y="396">untrusted draft</text>
    <rect class="edge-label-bg" x="1070" y="432" width="160" height="20"/>
    <text class="edge-label" x="1150" y="446">exact reference set</text>
    <rect class="edge-label-bg" x="1249" y="532" width="42" height="20"/>
    <text class="edge-label" x="1270" y="546">gate</text>
    <rect class="edge-label-bg" x="930" y="656" width="116" height="20"/>
    <text class="edge-label" x="988" y="670">decision receipt</text>
    <rect class="edge-label-bg" x="558" y="656" width="150" height="20"/>
    <text class="edge-label" x="633" y="670">policy + scope digest</text>
  </g>

  <g>
    <rect class="node" x="80" y="190" width="180" height="100" rx="14" stroke="#16324F"/>
    <text class="node-title" x="170" y="232">Verified request</text>
    <text class="node-copy" x="170" y="258">subject + bounded query</text>
  </g>
  <g>
    <rect class="node" x="320" y="180" width="200" height="120" rx="14" stroke="#2F6BFF"/>
    <text class="node-title" x="420" y="222">Policy resolver</text>
    <text class="node-copy" x="420" y="250">tenant • sensitivity</text>
    <text class="node-copy" x="420" y="272">lifecycle • freshness</text>
  </g>
  <g>
    <rect class="node" x="580" y="180" width="190" height="120" rx="14" stroke="#16A3A5"/>
    <text class="node-title" x="675" y="222">Protected corpus</text>
    <text class="node-copy" x="675" y="250">canonical metadata</text>
    <text class="node-copy" x="675" y="272">versions + digests</text>
  </g>
  <g>
    <rect class="node" x="830" y="180" width="190" height="120" rx="14" stroke="#16A3A5"/>
    <text class="node-title" x="925" y="222">Rank eligible only</text>
    <text class="node-copy" x="925" y="250">BM25 • vector • hybrid</text>
  </g>
  <g>
    <rect class="node" x="1080" y="180" width="150" height="120" rx="14" stroke="#16A3A5"/>
    <text class="node-title" x="1155" y="220">Evidence</text>
    <text class="node-title" x="1155" y="242">snapshots</text>
    <text class="node-copy" x="1155" y="270">ID + version + digest</text>
  </g>
  <g>
    <rect class="node" x="1340" y="180" width="180" height="120" rx="14" stroke="#7667E8" stroke-dasharray="7 6"/>
    <text class="node-title" x="1430" y="220">Model drafts</text>
    <text class="node-copy" x="1430" y="248">claims • citations</text>
    <text class="node-copy" x="1430" y="270">action proposals</text>
  </g>
  <g>
    <rect class="node" x="960" y="510" width="280" height="100" rx="14" stroke="#2F6BFF"/>
    <text class="node-title" x="1100" y="550">Verify before release</text>
    <text class="node-copy" x="1100" y="578">capability • exact refs • support</text>
  </g>
  <g>
    <rect class="node" x="1300" y="510" width="220" height="100" rx="14" stroke="#16324F"/>
    <text class="node-title" x="1410" y="550">Safe terminal result</text>
    <text class="node-copy" x="1410" y="578">answer • abstain • block</text>
  </g>
  <g>
    <rect class="node" x="600" y="750" width="600" height="76" rx="14" stroke="#52606D"/>
    <text class="node-title" x="900" y="780">Minimized audit receipt</text>
    <text class="node-copy" x="900" y="806">query digest • policy/scope • evidence refs • decision</text>
  </g>

  <g aria-label="Legend">
    <circle cx="70" cy="870" r="6" fill="#2F6BFF"/>
    <text class="subtitle" x="85" y="875">trusted processing</text>
    <circle cx="260" cy="870" r="6" fill="#16A3A5"/>
    <text class="subtitle" x="275" y="875">retrieval and evidence</text>
    <circle cx="500" cy="870" r="6" fill="#7667E8"/>
    <text class="subtitle" x="515" y="875">untrusted model output</text>
    <path d="M720 870 H760" class="edge-secondary"/>
    <text class="subtitle" x="775" y="875">audit/control receipt</text>
  </g>
</svg>
