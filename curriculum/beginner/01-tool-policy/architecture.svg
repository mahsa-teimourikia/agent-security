<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tool policy at the trusted execution boundary</title>
  <desc id="desc">An agent proposes a tool call. The trusted application validates its schema, combines authenticated identity and resource data, applies policy and approval checks, and either blocks the call or sends it to a protected effect executor while recording a redacted audit receipt.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2F6BFF"/></marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52606D"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#F59E42"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.10"/></filter>
    <style>
      .title{font:700 32px Inter,Arial,sans-serif;fill:#16324F}.subtitle{font:400 16px Inter,Arial,sans-serif;fill:#52606D}
      .group-label{font:700 18px Inter,Arial,sans-serif;fill:#16324F}.node-title{font:700 18px Inter,Arial,sans-serif;fill:#16324F}
      .node-sub{font:400 14px Inter,Arial,sans-serif;fill:#52606D}.edge-label{font:600 13px Inter,Arial,sans-serif;fill:#334E68}
      .edge{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.audit-edge{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text class="title" x="64" y="64">Tool policy at the trusted execution boundary</text>
  <text class="subtitle" x="64" y="96">Schemas shape proposals. Trusted application policy grants—or refuses—authority.</text>

  <rect x="64" y="140" width="320" height="540" rx="18" fill="#FAF9FF" stroke="#D9D3FA" stroke-width="2"/>
  <rect x="440" y="140" width="750" height="700" rx="18" fill="#FFFFFF" stroke="#C8D7F4" stroke-width="2"/>
  <rect x="1240" y="140" width="296" height="540" rx="18" fill="#FFFBF5" stroke="#F3D3A8" stroke-width="2"/>
  <text class="group-label" x="88" y="176">Untrusted decision input</text>
  <text class="group-label" x="464" y="176">Trusted application control plane</text>
  <text class="group-label" x="1264" y="176">Protected system</text>

  <path class="edge" d="M344 390 H488 V425" stroke="#7667E8" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="362" y="378">untrusted proposal</text>
  <path class="edge" d="M738 425 H820 V430" stroke="#2F6BFF" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="744" y="411">valid shape</text>
  <path class="edge" d="M738 255 H895 V330" stroke="#2F6BFF" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="760" y="242">trusted identity</text>
  <path class="edge" d="M738 665 H780 V570 H895 V530" stroke="#16A3A5" marker-end="url(#arrow-slate)"/>
  <text class="edge-label" x="746" y="590">grants + ownership</text>
  <path class="edge" d="M1045 610 V530" stroke="#16A3A5" marker-end="url(#arrow-slate)"/>
  <text class="edge-label" x="1056" y="574">bound receipt</text>
  <path class="edge" d="M1120 430 H1275 V425" stroke="#F59E42" marker-end="url(#arrow-orange)"/>
  <text class="edge-label" x="1160" y="415">ALLOW only</text>
  <path class="edge audit-edge" d="M844 530 H780 V760" stroke="#52606D" marker-end="url(#arrow-slate)"/>
  <text class="edge-label" x="642" y="552">allow / deny / pause</text>
  <path class="edge audit-edge" d="M1387.5 485 V790 H1120" stroke="#52606D" marker-end="url(#arrow-slate)"/>
  <text class="edge-label" x="1240" y="778">verified effect</text>

  <g filter="url(#shadow)"><rect x="104" y="330" width="240" height="120" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/></g>
  <text class="node-title" x="224" y="378" text-anchor="middle">Model / agent</text>
  <text class="node-sub" x="224" y="408" text-anchor="middle">Proposes tool + arguments</text>

  <g filter="url(#shadow)"><rect x="488" y="205" width="250" height="100" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/></g>
  <text class="node-title" x="613" y="244" text-anchor="middle">Authenticated context</text>
  <text class="node-sub" x="613" y="272" text-anchor="middle">Subject, tenant, scopes, run</text>

  <g filter="url(#shadow)"><rect x="488" y="365" width="250" height="120" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/></g>
  <text class="node-title" x="613" y="410" text-anchor="middle">SDK + Pydantic schema</text>
  <text class="node-sub" x="613" y="438" text-anchor="middle">Parse shape; reject malformed input</text>

  <g filter="url(#shadow)"><rect x="820" y="330" width="300" height="200" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="3"/></g>
  <text class="node-title" x="970" y="371" text-anchor="middle">Policy gateway</text>
  <text class="node-sub" x="970" y="406" text-anchor="middle">Authorize resource and scope</text>
  <text class="node-sub" x="970" y="434" text-anchor="middle">Validate business rules</text>
  <text class="node-sub" x="970" y="462" text-anchor="middle">Bind approval + enforce budget</text>
  <rect x="864" y="483" width="212" height="28" rx="14" fill="#D9E6FF"/>
  <text class="edge-label" x="970" y="502" text-anchor="middle">ALLOW · DENY · PAUSE</text>

  <g filter="url(#shadow)"><rect x="488" y="610" width="250" height="110" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/></g>
  <text class="node-title" x="613" y="652" text-anchor="middle">IAM + resource registry</text>
  <text class="node-sub" x="613" y="681" text-anchor="middle">Authoritative ownership and grants</text>

  <g filter="url(#shadow)"><rect x="820" y="610" width="300" height="110" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/></g>
  <text class="node-title" x="970" y="652" text-anchor="middle">Approval service</text>
  <text class="node-sub" x="970" y="681" text-anchor="middle">Exact digest, policy, expiry, one use</text>

  <g filter="url(#shadow)"><rect x="1275" y="365" width="225" height="120" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/></g>
  <text class="node-title" x="1388" y="410" text-anchor="middle">Effect executor</text>
  <text class="node-sub" x="1388" y="438" text-anchor="middle">Idempotent API / tool call</text>

  <rect x="488" y="760" width="632" height="60" rx="14" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
  <text class="node-title" x="804" y="786" text-anchor="middle">Redacted decision and effect receipts</text>
  <text class="node-sub" x="804" y="808" text-anchor="middle">Correlation · digest · policy version · reason · terminal state</text>
</svg>
