<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contain prompt injection at the effect boundary</title>
  <desc id="desc">Untrusted content can influence a model and bypass a detector, but a trusted application resolves canonical source evidence and checks an exact one-use grant before allowing a protected effect.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #16324f; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526579; }
      .group-label { font-size: 17px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .node-subtitle { font-size: 14px; fill: #526579; text-anchor: middle; }
      .edge { fill: none; stroke: #526579; stroke-width: 3; marker-end: url(#arrow); }
      .probabilistic { stroke: #d18421; stroke-dasharray: 10 8; }
      .audit-edge { stroke: #8594a5; stroke-dasharray: 5 7; }
      .edge-label { font-size: 13px; font-weight: 650; text-anchor: middle; }
      .label-bg { fill: #f7f9fc; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text class="title" x="56" y="66">Contain prompt injection at the effect boundary</text>
  <text class="subtitle" x="56" y="98">Detection reduces risk. Canonical evidence and exact authorization contain a miss.</text>

  <rect x="56" y="140" width="660" height="540" rx="18" fill="#faf9ff" stroke="#d9d3fa" stroke-width="2"/>
  <rect x="760" y="140" width="500" height="700" rx="18" fill="#ffffff" stroke="#c8d7f4" stroke-width="2"/>
  <rect x="1304" y="140" width="240" height="540" rx="18" fill="#fffbf5" stroke="#f3d3a8" stroke-width="2"/>
  <text class="group-label" x="80" y="176">Untrusted evidence path</text>
  <text class="group-label" x="784" y="176">Trusted application control plane</text>
  <text class="group-label" x="1328" y="176">Protected system</text>

  <g id="content">
    <rect x="88" y="300" width="176" height="112" rx="14" fill="#f0eeff" stroke="#7667e8" stroke-width="2"/>
    <text class="node-title" x="176" y="342">External content</text>
    <text class="node-subtitle" x="176" y="369">Web, files, memory,</text>
    <text class="node-subtitle" x="176" y="389">tool output</text>
  </g>
  <g id="ingestion">
    <rect x="304" y="292" width="188" height="128" rx="14" fill="#e5f7f6" stroke="#16a3a5" stroke-width="2"/>
    <text class="node-title" x="398" y="334">Canonical ingestion</text>
    <text class="node-subtitle" x="398" y="363">ID, version, digest,</text>
    <text class="node-subtitle" x="398" y="383">provenance</text>
  </g>
  <g id="detector">
    <rect x="532" y="300" width="152" height="112" rx="14" fill="#fff7e8" stroke="#e09b32" stroke-width="2"/>
    <text class="node-title" x="608" y="342">Detector signal</text>
    <text class="node-subtitle" x="608" y="372">Probabilistic;</text>
    <text class="node-subtitle" x="608" y="392">may miss</text>
  </g>
  <g id="model">
    <rect x="532" y="500" width="152" height="104" rx="14" fill="#f0eeff" stroke="#7667e8" stroke-width="2"/>
    <text class="node-title" x="608" y="542">Model</text>
    <text class="node-subtitle" x="608" y="572">Assume influenced</text>
  </g>

  <g id="trusted-context">
    <rect x="808" y="190" width="260" height="96" rx="14" fill="#e5f7f6" stroke="#16a3a5" stroke-width="2"/>
    <text class="node-title" x="938" y="229">Trusted workflow context</text>
    <text class="node-subtitle" x="938" y="258">Subject, tenant, run, time</text>
  </g>
  <g id="policy">
    <rect x="808" y="330" width="260" height="160" rx="14" fill="#eaf1ff" stroke="#2f6bff" stroke-width="3"/>
    <text class="node-title" x="938" y="371">Policy gateway</text>
    <text class="node-subtitle" x="938" y="403">Resolve sources + validate schema</text>
    <text class="node-subtitle" x="938" y="426">Bind exact effect</text>
    <text class="node-subtitle" x="938" y="449">Consume grant atomically</text>
  </g>
  <g id="grant">
    <rect x="808" y="550" width="260" height="104" rx="14" fill="#e5f7f6" stroke="#16a3a5" stroke-width="2"/>
    <text class="node-title" x="938" y="590">Exact one-use grant</text>
    <text class="node-subtitle" x="938" y="620">Effect digest, policy, expiry</text>
  </g>
  <g id="decision">
    <rect x="1112" y="354" width="116" height="112" rx="14" fill="#eaf1ff" stroke="#2f6bff" stroke-width="2"/>
    <text class="node-title" x="1170" y="398">Decision</text>
    <text class="node-subtitle" x="1170" y="428">DENY or</text>
    <text class="node-subtitle" x="1170" y="448">ALLOW only</text>
  </g>
  <g id="audit">
    <rect x="808" y="730" width="420" height="80" rx="14" fill="#ffffff" stroke="#aab7c7" stroke-width="2"/>
    <text class="node-title" x="1018" y="762">Redacted evidence receipt</text>
    <text class="node-subtitle" x="1018" y="790">Digests, policy, reason, terminal state</text>
  </g>
  <g id="executor">
    <rect x="1336" y="350" width="176" height="120" rx="14" fill="#fff1df" stroke="#f59e42" stroke-width="3"/>
    <text class="node-title" x="1424" y="394">Effect executor</text>
    <text class="node-subtitle" x="1424" y="424">Idempotent</text>
    <text class="node-subtitle" x="1424" y="444">API / tool</text>
  </g>

  <path class="edge" d="M264 356 H304"/>
  <path class="edge" d="M492 356 H532"/>
  <path class="edge probabilistic" d="M608 412 V500"/>
  <path class="edge" d="M684 552 H744 V410 H808"/>
  <path class="edge" d="M938 286 V330"/>
  <path class="edge" d="M938 550 V490"/>
  <path class="edge" d="M1068 410 H1112"/>
  <path class="edge" d="M1228 410 H1336"/>
  <path class="edge audit-edge" d="M1060 490 H1092 V702 H1060 V730"/>
  <path class="edge audit-edge" d="M1424 470 V770 H1228"/>

  <rect class="label-bg" x="570" y="443" width="76" height="23" rx="5"/>
  <text class="edge-label" x="608" y="460">may miss</text>
  <rect class="label-bg" x="688" y="462" width="112" height="23" rx="5"/>
  <text class="edge-label" x="744" y="479">untrusted proposal</text>
  <rect class="label-bg" x="1247" y="391" width="72" height="23" rx="5"/>
  <text class="edge-label" x="1283" y="408">ALLOW only</text>
  <rect class="label-bg" x="1100" y="694" width="82" height="23" rx="5"/>
  <text class="edge-label" x="1141" y="711">allow / deny</text>
  <text class="subtitle" x="88" y="638">A clean signal never promotes content into authority.</text>
  <text class="subtitle" x="1336" y="520">Receives no raw prompt</text>
  <text class="subtitle" x="1336" y="542">or model credential.</text>
</svg>
