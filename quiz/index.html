<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Security Knowledge Check</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#172522;background:#f4f5ef}h1{font-family:Georgia;font-size:48px;margin-bottom:8px}.lede{color:#62736b;line-height:1.6}.question{border:1px solid #d8ded7;background:#fff;padding:22px;margin:18px 0;border-radius:4px}.question h2{font:24px Georgia;margin:8px 0 18px}.topic{color:#1d6d5c;font-size:11px;letter-spacing:.15em;font-weight:bold;text-transform:uppercase}.option{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:12px;border:1px solid #d8ded7;cursor:pointer}.option:hover,.option.selected{background:#e7eee6;border-color:#8bad9a}.option input{accent-color:#1d6d5c;margin-top:3px}.correct{border-color:#2c805c!important;background:#e4f1e7!important}.incorrect{border-color:#bd5a4e!important;background:#fae8e5!important}.explanation{margin-top:14px;padding:13px;background:#eef3ed;line-height:1.55}.button{background:#1d6d5c;color:white;border:0;padding:13px 18px;cursor:pointer;font-size:15px;margin:6px 8px 6px 0}.button.secondary{background:transparent;color:#1d6d5c;border:1px solid #1d6d5c}.result{background:#d9eadc;padding:20px;margin:25px 0;line-height:1.6}.progress{position:sticky;top:0;background:#f4f5ef;padding:10px 0;z-index:2}.oneplus{margin-top:40px;border-top:1px solid #ddd;padding-top:18px;display:flex;gap:10px;align-items:center}.oneplus img{width:34px;height:34px;background:white;border-radius:50%;padding:3px}@media(max-width:600px){h1{font-size:38px}.question{padding:16px}}</style></head><body><p><a href="../">← Learning Hub</a></p><h1>Agent Security Knowledge Check</h1><p class="lede">Select every correct answer. Questions cover foundations through production governance. Your answers stay in this browser.</p><p class="progress" id="progress"></p><form id="quiz"></form><button class="button" id="grade" type="button">Grade quiz</button><button class="button secondary" id="reset" type="button">Reset answers</button><div id="result" class="result" hidden></div><footer class="oneplus"><img src="../assets/one-plus-i.png" alt="One+i"><span>Learning with One+i · responsible AI, real-world impact</span><a href="https://oneplusi.io">oneplusi.io ↗</a></footer><script type="module">import {questions} from './questions.js';const form=document.querySelector('#quiz'),progress=document.querySelector('#progress'),result=document.querySelector('#result');let graded=false;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));questions.forEach((q,i)=>{form.insertAdjacentHTML('beforeend',`<section class="question" data-index="${i}"><span class="topic">${esc(q.topic)}</span><h2>${i+1}. ${esc(q.prompt)}</h2>${q.options.map((o,j)=>`<label class="option"><input type="checkbox" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}<div class="explanation" hidden></div></section>`)});function update(){const answered=questions.filter((q,i)=>form.querySelectorAll(`input[name=q${i}]:checked`).length).length;progress.textContent=`${answered}/${questions.length} questions answered`;form.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));}form.onchange=update;document.querySelector('#grade').onclick=()=>{let score=0;questions.forEach((q,i)=>{const section=form.querySelector(`[data-index="${i}"]`),got=[...section.querySelectorAll('input:checked')].map(x=>+x.value).sort(),right=JSON.stringify(got)===JSON.stringify(q.correct);if(right)score++;section.querySelectorAll('.option').forEach((label,j)=>{label.classList.toggle('correct',q.correct.includes(j));label.classList.toggle('incorrect',label.querySelector('input').checked&&!q.correct.includes(j));});const explanation=section.querySelector('.explanation');explanation.hidden=false;explanation.innerHTML=`<strong>${right?'Correct':'Review this answer'}</strong><br>${esc(q.explanation)}<br><small>Correct options: ${q.correct.map(j=>esc(q.options[j])).join('; ')}</small>`});const pct=Math.round(score/questions.length*100);result.hidden=false;result.innerHTML=`<strong>Score: ${score}/${questions.length} (${pct}%)</strong><br>${pct>=80?'Strong security reasoning. Revisit any missed explanations before moving on.':pct>=60?'Good foundation. Review the highlighted explanations and retry the missed topics.':'Use the lesson links in the Hub, then try again.'}`;result.scrollIntoView({behavior:'smooth'});graded=true;};document.querySelector('#reset').onclick=()=>{form.reset();graded=false;result.hidden=true;form.querySelectorAll('.option,.explanation').forEach(x=>x.classList.remove('correct','incorrect')|| (x.hidden=x.classList.contains('explanation')));update();window.scrollTo({top:0,behavior:'smooth'});};update();</script></body></html>
