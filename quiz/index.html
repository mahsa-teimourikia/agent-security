<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Security Knowledge Check</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#172522}h1{font-family:Georgia;font-size:48px}.question{border-top:1px solid #ddd;padding:20px 0}.option{display:block;margin:8px 0}.button{background:#1d6d5c;color:white;border:0;padding:12px 18px;cursor:pointer}.result{background:#e5efe6;padding:18px;margin-top:25px}.oneplus{margin-top:40px;border-top:1px solid #ddd;padding-top:18px;display:flex;gap:10px;align-items:center}.oneplus img{width:34px;height:34px;background:white;border-radius:50%;padding:3px}</style></head><body><p><a href="../">← Learning Hub</a></p><h1>Agent Security Knowledge Check</h1><p>Select every correct answer. Each topic tests a security concept, failure mode, and control.</p><form id="quiz"></form><button class="button" id="grade">Grade quiz</button><div id="result" class="result" hidden></div><footer class="oneplus"><img src="../assets/one-plus-i.png" alt="One+i"><span>Learning with One+i · responsible AI, real-world impact</span><a href="https://oneplusi.io">oneplusi.io ↗</a></footer><script type="module">import {questions} from './questions.js';const form=document.querySelector('#quiz');questions.forEach((q,i)=>{form.insertAdjacentHTML('beforeend',`<section class="question"><h2>${i+1}. ${q.prompt}</h2>${q.options.map((o,j)=>`<label class="option"><input type="checkbox" name="q${i}" value="${j}"> ${o}</label>`).join('')}<details><summary>Answer explanation</summary><p>${q.explanation}</p></details></section>`)});document.querySelector('#grade').onclick=()=>{let score=0;questions.forEach((q,i)=>{const got=[...form.querySelectorAll(`input[name=q${i}]:checked`)].map(x=>+x.value).sort();if(JSON.stringify(got)===JSON.stringify(q.correct))score++});const result=document.querySelector('#result');result.hidden=false;result.textContent=`Score: ${score}/${questions.length} (${Math.round(score/questions.length*100)}%)`;};</script></body></html>
